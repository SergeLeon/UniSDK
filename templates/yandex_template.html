<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: none; }
        #canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; outline: none; }
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #151515; z-index: 99; transition: opacity 0.3s ease; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: #fc3f1d; animation: spin 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #progress-bar-container { width: 200px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 20px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #fc3f1d; border-radius: 3px; transition: width 0.1s linear; }
    </style>

    <script src="/sdk.js"></script>

    <script>
    (function () {
        'use strict';
        if (window.GodotYandexBridge) return;

        var DEBUG_BRIDGE = false;
        function log()    { if (DEBUG_BRIDGE) console.log.apply(console, ['[GodotYandexBridge]'].concat([].slice.call(arguments))); }
        function warn()   { console.warn.apply(console, ['[GodotYandexBridge]'].concat([].slice.call(arguments))); }
        function errlog() { console.error.apply(console, ['[GodotYandexBridge]'].concat([].slice.call(arguments))); }

        // Сколько ждём облако Яндекс.Игр, прежде чем отдать локальный кэш.
        var PLAYER_DATA_CLOUD_TIMEOUT_MS = 8000;

        var LS_PREFIX = 'unisdk_yandex_';
        function lsKey(k) { return LS_PREFIX + k; }
        function lsGet(k) { try { var v = localStorage.getItem(lsKey(k)); return v === null ? null : JSON.parse(v); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch (e) {} }
        function lsRemove(k) { try { localStorage.removeItem(lsKey(k)); } catch (e) {} }

        // Единый формат для сравнения diff-значений.
        // Возвращает либо null, либо строку (JSON для структур, саму строку для строк).
        function normalizeValue(v) {
            if (v === null || v === undefined) return null;
            if (typeof v === 'string') return v;
            try { return JSON.stringify(v); } catch (e) { return String(v); }
        }

        // Единый формат для сравнения со значением из localStorage (там всегда JSON-строка).
        function normalizeFromStorage(k) {
            try {
                var raw = localStorage.getItem(lsKey(k));
                if (raw === null) return null;
                var parsed = JSON.parse(raw);
                return normalizeValue(parsed);
            } catch (e) { return null; }
        }

        var Bridge = {
            ysdk: null, player: null, payments: null, leaderboards: null,
            isInitialized: false, pauseResumeCallback: null,
            _sentValues: {},

            _withTimeout: function (promise, timeoutMs, fallbackValue) {
                return new Promise(function (resolve) {
                    var settled = false;
                    var timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        warn("Yandex call timeout");
                        resolve(fallbackValue);
                    }, timeoutMs);
                    Promise.resolve(promise).then(
                        function (data) { if (settled) return; settled = true; clearTimeout(timer); resolve(data); },
                        function (err) { if (settled) return; settled = true; clearTimeout(timer); warn("Yandex call failed:", err); resolve(fallbackValue); }
                    );
                });
            },

            async init(optionsJson, callback) {
                try {
                    const options = optionsJson ? JSON.parse(optionsJson) : {};
                    if (typeof YaGames === 'undefined') {
                        throw new Error("YaGames SDK script is not loaded in window.");
                    }
                    this.ysdk = await YaGames.init(options);
                    this.isInitialized = true;

                    if (this.ysdk.on) {
                        this.ysdk.on('game_api_pause', () => {
                            if (this.pauseResumeCallback) this.pauseResumeCallback(JSON.stringify({ event: 'pause' }));
                        });
                        this.ysdk.on('game_api_resume', () => {
                            this.refocusCanvas();
                            if (this.pauseResumeCallback) this.pauseResumeCallback(JSON.stringify({ event: 'resume' }));
                        });
                        if (this.ysdk.EVENTS) {
                            if (this.ysdk.EVENTS.HISTORY_BACK) {
                                this.ysdk.on(this.ysdk.EVENTS.HISTORY_BACK, () => {
                                    if (this.pauseResumeCallback) this.pauseResumeCallback(JSON.stringify({ event: 'history_back' }));
                                });
                            }
                            if (this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_OPENED) {
                                this.ysdk.on(this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_OPENED, () => {
                                    if (this.pauseResumeCallback) this.pauseResumeCallback(JSON.stringify({ event: 'account_selection_opened' }));
                                });
                            }
                            if (this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_CLOSED) {
                                this.ysdk.on(this.ysdk.EVENTS.ACCOUNT_SELECTION_DIALOG_CLOSED, () => {
                                    if (this.pauseResumeCallback) this.pauseResumeCallback(JSON.stringify({ event: 'account_selection_closed' }));
                                });
                            }
                        }
                    }

                    const env = this.getEnvironment();
                    const device = this.getDeviceInfo();
                    callback(JSON.stringify({ success: true, data: { environment: env, device: device } }));
                } catch (err) {
                    errlog("Init error:", err);
                    callback(JSON.stringify({ success: false, error: err.message || String(err) }));
                }
            },

            setPauseResumeCallback(cb) { this.pauseResumeCallback = cb; },

            loadingReady() { try { if (this.ysdk && this.ysdk.features && this.ysdk.features.LoadingAPI) this.ysdk.features.LoadingAPI.ready(); } catch (e) {} },
            gameplayStart() { try { if (this.ysdk && this.ysdk.features && this.ysdk.features.GameplayAPI) this.ysdk.features.GameplayAPI.start(); } catch (e) {} },
            gameplayStop() { try { if (this.ysdk && this.ysdk.features && this.ysdk.features.GameplayAPI) this.ysdk.features.GameplayAPI.stop(); } catch (e) {} },
            serverTime() { try { return this.ysdk ? this.ysdk.serverTime() : Date.now(); } catch (e) { return Date.now(); } },

            async isAvailableMethod(methodName, callback) {
                try {
                    if (!this.ysdk || !this.ysdk.isAvailableMethod) { callback(JSON.stringify({ success: true, available: false })); return; }
                    const available = await this.ysdk.isAvailableMethod(methodName);
                    callback(JSON.stringify({ success: true, available: !!available }));
                } catch (err) { callback(JSON.stringify({ success: false, available: false, error: err.message || String(err) })); }
            },

            getEnvironment() {
                if (!this.ysdk) return {};
                const env = this.ysdk.environment || {};
                return {
                    app: env.app || {},
                    browser: env.browser || { lang: navigator.language || 'ru' },
                    i18n: env.i18n || { lang: 'ru', tld: 'ru' },
                    payload: env.payload || '',
                    fullscreen: !!(env.screen && env.screen.fullscreen),
                    referrer: env.referrer || null
                };
            },

            getDeviceInfo() {
                if (!this.ysdk) return { type: 'desktop', isMobile: false, isTablet: false, isDesktop: true, isTV: false };
                const info = this.ysdk.deviceInfo || {};
                return {
                    type: info.type || 'desktop',
                    isMobile: typeof info.isMobile === 'function' ? info.isMobile() : info.type === 'mobile',
                    isTablet: typeof info.isTablet === 'function' ? info.isTablet() : info.type === 'tablet',
                    isDesktop: typeof info.isDesktop === 'function' ? info.isDesktop() : info.type === 'desktop',
                    isTV: typeof info.isTV === 'function' ? info.isTV() : info.type === 'tv'
                };
            },

            fullscreenStatus() { try { return !!(this.ysdk && this.ysdk.screen && this.ysdk.screen.fullscreen && this.ysdk.screen.fullscreen.status === 'on'); } catch (e) { return false; } },
            async fullscreenRequest(callback) { try { if (this.ysdk && this.ysdk.screen && this.ysdk.screen.fullscreen) { await this.ysdk.screen.fullscreen.request(); callback(JSON.stringify({ success: true, status: 'on' })); } else { callback(JSON.stringify({ success: false, error: 'Screen API not available' })); } } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async fullscreenExit(callback) { try { if (this.ysdk && this.ysdk.screen && this.ysdk.screen.fullscreen) { await this.ysdk.screen.fullscreen.exit(); callback(JSON.stringify({ success: true, status: 'off' })); } else { callback(JSON.stringify({ success: false, error: 'Screen API not available' })); } } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            screenOrientationGet() { try { if (this.ysdk && this.ysdk.screen && this.ysdk.screen.orientation && typeof this.ysdk.screen.orientation.get === 'function') return this.ysdk.screen.orientation.get(); return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'; } catch (e) { return 'landscape'; } },
            screenOrientationSet(value, callback) { try { if (this.ysdk && this.ysdk.screen && this.ysdk.screen.orientation && typeof this.ysdk.screen.orientation.set === 'function') { this.ysdk.screen.orientation.set(value); if (callback) callback(JSON.stringify({ success: true, orientation: value })); } else { if (callback) callback(JSON.stringify({ success: false, error: 'screen.orientation.set not supported' })); } } catch (err) { if (callback) callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            refocusCanvas() { try { window.focus(); var canvas = document.getElementById('canvas') || document.querySelector('canvas'); if (canvas && typeof canvas.focus === 'function') canvas.focus(); } catch (e) {} },

            showFullscreenAdv(callback) {
                if (!this.ysdk || !this.ysdk.adv) { callback(JSON.stringify({ event: 'error', error: 'SDK not initialized' })); return; }
                const safe = (payload) => { try { callback(payload); } catch (e) { errlog("callback threw:", e); } };
                this.ysdk.adv.showFullscreenAdv({ callbacks: {
                    onOpen: () => safe(JSON.stringify({ event: 'open' })),
                    onClose: (wasShown) => { this.refocusCanvas(); setTimeout(() => this.refocusCanvas(), 100); safe(JSON.stringify({ event: 'close', wasShown: !!wasShown })); },
                    onError: (err) => { this.refocusCanvas(); safe(JSON.stringify({ event: 'error', error: err ? (err.message || String(err)) : 'Unknown ad error' })); },
                    onOffline: () => { this.refocusCanvas(); safe(JSON.stringify({ event: 'offline' })); }
                }});
            },

            showRewardedVideo(callback) {
                if (!this.ysdk || !this.ysdk.adv) { callback(JSON.stringify({ event: 'error', error: 'SDK not initialized' })); return; }
                const safe = (payload) => { try { callback(payload); } catch (e) { errlog("callback threw:", e); } };
                this.ysdk.adv.showRewardedVideo({ callbacks: {
                    onOpen: () => safe(JSON.stringify({ event: 'open' })),
                    onRewarded: () => safe(JSON.stringify({ event: 'rewarded' })),
                    onClose: (wasShown) => { this.refocusCanvas(); setTimeout(() => this.refocusCanvas(), 100); safe(JSON.stringify({ event: 'close', wasShown: !!wasShown })); },
                    onError: (err) => { this.refocusCanvas(); safe(JSON.stringify({ event: 'error', error: err ? (err.message || String(err)) : 'Unknown rewarded ad error' })); }
                }});
            },

            async getBannerAdvStatus(callback) { try { if (!this.ysdk || !this.ysdk.adv || !this.ysdk.adv.getBannerAdvStatus) { callback(JSON.stringify({ success: true, stickyAdvIsShowing: false, reason: 'ADV_IS_NOT_CONNECTED' })); return; } const res = await this.ysdk.adv.getBannerAdvStatus(); callback(JSON.stringify({ success: true, stickyAdvIsShowing: !!res.stickyAdvIsShowing, reason: res.reason || null })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async showBannerAdv(callback) { try { if (!this.ysdk || !this.ysdk.adv || !this.ysdk.adv.showBannerAdv) { callback(JSON.stringify({ success: false, error: 'Banner API not available' })); return; } const res = await this.ysdk.adv.showBannerAdv(); callback(JSON.stringify({ success: true, stickyAdvIsShowing: !!res.stickyAdvIsShowing, reason: res.reason || null })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async hideBannerAdv(callback) { try { if (!this.ysdk || !this.ysdk.adv || !this.ysdk.adv.hideBannerAdv) { callback(JSON.stringify({ success: false, error: 'Banner API not available' })); return; } const res = await this.ysdk.adv.hideBannerAdv(); callback(JSON.stringify({ success: true, stickyAdvIsShowing: !!res.stickyAdvIsShowing })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async initPlayer(optionsJson, callback) {
                try {
                    if (!this.ysdk) throw new Error("SDK not initialized");
                    const options = optionsJson ? JSON.parse(optionsJson) : { scopes: true };
                    this.player = await this.ysdk.getPlayer(options);
                    const data = {
                        isAuthorized: this.player.isAuthorized(),
                        uniqueId: this.player.getUniqueID ? this.player.getUniqueID() : '',
                        name: this.player.getName ? this.player.getName() : '',
                        photoSmall: this.player.getPhoto ? this.player.getPhoto('small') : '',
                        photoMedium: this.player.getPhoto ? this.player.getPhoto('medium') : '',
                        photoLarge: this.player.getPhoto ? this.player.getPhoto('large') : '',
                        payingStatus: this.player.getPayingStatus ? this.player.getPayingStatus() : '',
                        signature: this.player.getSignature ? this.player.getSignature() : ''
                    };
                    callback(JSON.stringify({ success: true, data: data }));
                } catch (err) {
                    callback(JSON.stringify({ success: false, error: err.message || String(err) }));
                }
            },

            async openAuthDialog(callback) {
                try {
                    if (!this.ysdk || !this.ysdk.auth) throw new Error("Auth API not available");
                    await this.ysdk.auth.openAuthDialog();
                    if (this.ysdk.getPlayer) this.player = await this.ysdk.getPlayer({ scopes: true });
                    const isAuth = this.player ? this.player.isAuthorized() : false;
                    callback(JSON.stringify({ success: true, data: {
                        isAuthorized: isAuth,
                        uniqueId: (isAuth && this.player.getUniqueID) ? this.player.getUniqueID() : '',
                        name: (isAuth && this.player.getName) ? this.player.getName() : '',
                        photoSmall: (isAuth && this.player.getPhoto) ? this.player.getPhoto('small') : '',
                        photoMedium: (isAuth && this.player.getPhoto) ? this.player.getPhoto('medium') : '',
                        photoLarge: (isAuth && this.player.getPhoto) ? this.player.getPhoto('large') : ''
                    }}));
                } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); }
            },

            async getPlayerIDsPerGame(callback) {
                try {
                    if (!this.player || !this.player.getIDsPerGame) throw new Error("Player not initialized");
                    const ids = await this.player.getIDsPerGame();
                    callback(JSON.stringify({ success: true, data: ids }));
                } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); }
            },

            getPlayerData(keysJson, callback) {
                var self = this;
                if (!this.player) { callback(JSON.stringify({ success: false, error: "Player not initialized" })); return; }
                var keys = keysJson ? JSON.parse(keysJson) : undefined;
                var keysArr = (keys === undefined || keys === null) ? null : (Array.isArray(keys) ? keys : [keys]);

                var localResult = {};
                var hasLocalData = false;
                if (keysArr) {
                    for (var i = 0; i < keysArr.length; i++) {
                        var v = lsGet("player_" + keysArr[i]);
                        if (v !== null) { localResult[keysArr[i]] = v; hasLocalData = true; }
                    }
                }

                // Облако SDK — источник истины для синхронизации между
                // устройствами. Локальный кэш отдаём только при недоступности
                // облака, иначе старое устройство затирало бы свежий прогресс.
                var settled = false;
                var timer = setTimeout(function () {
                    if (settled) return;
                    settled = true;
                    callback(JSON.stringify({
                        success: true,
                        data: localResult,
                        cloud_ok: false,
                        from_cache: hasLocalData
                    }));
                }, PLAYER_DATA_CLOUD_TIMEOUT_MS);

                Promise.resolve(this.player.getData(keys))
                    .then(function (data) {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        var result = data || {};
                        for (var k in result) {
                            if (Object.prototype.hasOwnProperty.call(result, k)) {
                                lsSet("player_" + k, result[k]);
                                self._sentValues[k] = normalizeValue(result[k]);
                            }
                        }
                        if (keysArr) {
                            for (var i = 0; i < keysArr.length; i++) {
                                var kk = keysArr[i];
                                if (!(kk in result)) { delete self._sentValues[kk]; }
                            }
                        }
                        callback(JSON.stringify({ success: true, data: result, cloud_ok: true }));
                    })
                    .catch(function (err) {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        warn("player.getData failed: " + (err && err.message ? err.message : err));
                        callback(JSON.stringify({ success: true, data: localResult, cloud_ok: false, from_cache: hasLocalData }));
                    });
            },

            setPlayerData(dataJson, flush, callback) {
                var self = this;
                if (!this.player) { callback(JSON.stringify({ success: false, error: "Player not initialized", cloud_ok: false })); return; }
                var data;
                try { data = JSON.parse(dataJson); } catch (e) { callback(JSON.stringify({ success: false, error: "Invalid JSON", cloud_ok: false })); return; }

                for (var k in data) { if (Object.prototype.hasOwnProperty.call(data, k)) { lsSet("player_" + k, data[k]); } }

                var changed = {};
                var changedCount = 0;
                var totalCount = 0;
                for (var k2 in data) {
                    if (Object.prototype.hasOwnProperty.call(data, k2)) {
                        totalCount++;
                        var normalised = normalizeValue(data[k2]);
                        if (self._sentValues[k2] !== normalised) { changed[k2] = data[k2]; changedCount++; }
                    }
                }

                if (changedCount === 0) { callback(JSON.stringify({ success: true, changed: 0, cloud_ok: true })); return; }

                Promise.resolve(this.player.setData(changed, !!flush))
                    .then(function () {
                        for (var k3 in changed) {
                            if (Object.prototype.hasOwnProperty.call(changed, k3)) {
                                self._sentValues[k3] = normalizeValue(changed[k3]);
                            }
                        }
                        callback(JSON.stringify({ success: true, changed: changedCount, cloud_ok: true }));
                    })
                    .catch(function (err) {
                        // Данные уже в localStorage — сообщаем, что до облака не дошло,
                        // вызывающая сторона повторит запись позже.
                        callback(JSON.stringify({
                            success: true,
                            changed: changedCount,
                            cloud_ok: false,
                            error: err && err.message ? err.message : String(err)
                        }));
                    });
            },

            getChangedKeys(callback) {
                var self = this;
                var changed = [];
                try {
                    for (var i = 0; i < localStorage.length; i++) {
                        var k = localStorage.key(i);
                        if (!k || k.indexOf(LS_PREFIX + "player_") !== 0) continue;
                        var realKey = k.substring((LS_PREFIX + "player_").length);
                        var localNormalised = normalizeFromStorage("player_" + realKey);
                        if (self._sentValues[realKey] !== localNormalised) { changed.push(realKey); }
                    }
                } catch (e) {}
                callback(JSON.stringify({ success: true, changed: changed }));
            },

            async getPlayerStats(keysJson, callback) {
                try {
                    if (!this.player) throw new Error("Player not initialized");
                    const keys = keysJson ? JSON.parse(keysJson) : undefined;
                    const stats = await this.player.getStats(keys);
                    callback(JSON.stringify({ success: true, data: stats || {} }));
                } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); }
            },
            async setPlayerStats(statsJson, callback) {
                try {
                    if (!this.player) throw new Error("Player not initialized");
                    const stats = JSON.parse(statsJson);
                    await this.player.setStats(stats);
                    callback(JSON.stringify({ success: true }));
                } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); }
            },
            async incrementPlayerStats(incrementsJson, callback) {
                try {
                    if (!this.player) throw new Error("Player not initialized");
                    const increments = JSON.parse(incrementsJson);
                    const result = await this.player.incrementStats(increments);
                    callback(JSON.stringify({ success: true, data: result || {} }));
                } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); }
            },

            async getLeaderboardsInstance() {
                if (this.leaderboards) return this.leaderboards;
                if (this.ysdk.leaderboards) { this.leaderboards = this.ysdk.leaderboards; return this.leaderboards; }
                if (this.ysdk.getLeaderboards) { this.leaderboards = await this.ysdk.getLeaderboards(); return this.leaderboards; }
                throw new Error("Leaderboards API not available");
            },
            async getLeaderboardDescription(name, callback) { try { const lb = await this.getLeaderboardsInstance(); const fn = lb.getDescription || lb.getLeaderboardDescription; const desc = await fn.call(lb, name); callback(JSON.stringify({ success: true, data: desc })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async setLeaderboardScore(name, score, extraData, callback) { try { const lb = await this.getLeaderboardsInstance(); const fn = lb.setScore || lb.setLeaderboardScore; await fn.call(lb, name, score, extraData || undefined); callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async getLeaderboardPlayerEntry(name, callback) { try { const lb = await this.getLeaderboardsInstance(); const fn = lb.getPlayerEntry || lb.getLeaderboardPlayerEntry; const entry = await fn.call(lb, name); callback(JSON.stringify({ success: true, data: entry })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async getLeaderboardEntries(name, optionsJson, callback) { try { const lb = await this.getLeaderboardsInstance(); const options = optionsJson ? JSON.parse(optionsJson) : {}; const fn = lb.getEntries || lb.getLeaderboardEntries; const entries = await fn.call(lb, name, options); callback(JSON.stringify({ success: true, data: entries })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async initPayments(optionsJson, callback) { try { if (!this.ysdk) throw new Error("SDK not ready"); const options = optionsJson ? JSON.parse(optionsJson) : {}; if (this.ysdk.getPayments) this.payments = await this.ysdk.getPayments(options); else if (this.ysdk.payments) this.payments = this.ysdk.payments; callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async purchase(optionsJson, callback) { try { if (!this.payments) await this.initPayments(null, () => {}); const options = JSON.parse(optionsJson); const purchase = await this.payments.purchase(options); callback(JSON.stringify({ success: true, data: purchase })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async getPurchases(callback) { try { if (!this.payments) await this.initPayments(null, () => {}); const purchases = await this.payments.getPurchases(); callback(JSON.stringify({ success: true, data: purchases || [] })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async getCatalog(callback) { try { if (!this.payments) await this.initPayments(null, () => {}); const raw = await this.payments.getCatalog(); const catalog = (raw || []).map(p => ({ id: p.id || '', title: p.title || '', description: p.description || '', imageURI: p.imageURI || '', price: p.price || '', priceValue: p.priceValue || '', priceCurrencyCode: p.priceCurrencyCode || '', currencyImageSmall: typeof p.getPriceCurrencyImage === 'function' ? p.getPriceCurrencyImage('small') : '', currencyImageMedium: typeof p.getPriceCurrencyImage === 'function' ? p.getPriceCurrencyImage('medium') : '', currencyImageSvg: typeof p.getPriceCurrencyImage === 'function' ? p.getPriceCurrencyImage('svg') : '' })); callback(JSON.stringify({ success: true, data: catalog })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async consumePurchase(token, callback) { try { if (!this.payments) await this.initPayments(null, () => {}); await this.payments.consumePurchase(token); callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async canReview(callback) { try { if (!this.ysdk || !this.ysdk.feedback || !this.ysdk.feedback.canReview) { callback(JSON.stringify({ success: true, data: { value: false, reason: 'UNKNOWN' } })); return; } const res = await this.ysdk.feedback.canReview(); callback(JSON.stringify({ success: true, data: res })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async requestReview(callback) { try { if (!this.ysdk || !this.ysdk.feedback || !this.ysdk.feedback.requestReview) { callback(JSON.stringify({ success: false, error: 'Feedback API not available' })); return; } const res = await this.ysdk.feedback.requestReview(); callback(JSON.stringify({ success: true, data: res })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async canShowPrompt(callback) { try { if (!this.ysdk || !this.ysdk.shortcut || !this.ysdk.shortcut.canShowPrompt) { callback(JSON.stringify({ success: true, data: { canShow: false } })); return; } const res = await this.ysdk.shortcut.canShowPrompt(); callback(JSON.stringify({ success: true, data: res })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async showPrompt(callback) { try { if (!this.ysdk || !this.ysdk.shortcut || !this.ysdk.shortcut.showPrompt) { callback(JSON.stringify({ success: false, error: 'Shortcut API not available' })); return; } const res = await this.ysdk.shortcut.showPrompt(); callback(JSON.stringify({ success: true, data: res })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async getStorageItem(key, callback) { try { let storage = window.localStorage; if (this.ysdk && this.ysdk.getStorage) storage = await this.ysdk.getStorage(); const val = storage.getItem(key); callback(JSON.stringify({ success: true, value: val })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async setStorageItem(key, value, callback) { try { let storage = window.localStorage; if (this.ysdk && this.ysdk.getStorage) storage = await this.ysdk.getStorage(); storage.setItem(key, value); callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },

            async dispatchEvent(eventName, detailJson, callback) { try { if (!this.ysdk || !this.ysdk.dispatchEvent) { callback(JSON.stringify({ success: false, error: 'dispatchEvent not supported' })); return; } const detail = detailJson ? JSON.parse(detailJson) : undefined; await this.ysdk.dispatchEvent(eventName, detail); callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } },
            async dispatchExit(callback) { try { if (!this.ysdk || !this.ysdk.dispatchEvent || !this.ysdk.EVENTS) { callback(JSON.stringify({ success: false, error: 'EXIT event not supported' })); return; } await this.ysdk.dispatchEvent(this.ysdk.EVENTS.EXIT); callback(JSON.stringify({ success: true })); } catch (err) { callback(JSON.stringify({ success: false, error: err.message || String(err) })); } }
        };

        window.GodotYandexBridge = Bridge;

        // --- Флаш прогресса при сворачивании/закрытии ---
        // Мобильный WebView засыпает вместе с таймерами Godot, поэтому игре
        // нужно сообщить о скрытии страницы: она успевает записать прогресс.
        function notifyHidden() {
            try { if (Bridge.pauseResumeCallback) Bridge.pauseResumeCallback(JSON.stringify({ event: 'pause' })); } catch (e) {}
        }
        function notifyVisible() {
            try { if (Bridge.pauseResumeCallback) Bridge.pauseResumeCallback(JSON.stringify({ event: 'resume' })); } catch (e) {}
        }
        try {
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) notifyHidden(); else notifyVisible();
            });
            window.addEventListener('pagehide', notifyHidden);
            window.addEventListener('freeze', notifyHidden);
        } catch (e) {}
    })();
    </script>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault();" tabindex="0"></canvas>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
    </div>
    <script src="$GODOT_URL"></script>
    <script>
        const GODOT_CONFIG = $GODOT_CONFIG;
        const engine = new Engine(GODOT_CONFIG);
        (function () {
            const loadingOverlay = document.getElementById('loading-overlay');
            const progressBar = document.getElementById('progress-bar');
            const canvas = document.getElementById('canvas');
            window.addEventListener('pointerdown', () => { if (canvas) canvas.focus(); });
            engine.startGame({ onProgress: function (current, total) { if (total > 0) progressBar.style.width = ((current / total) * 100) + '%'; } })
                .then(() => { loadingOverlay.style.opacity = '0'; setTimeout(() => { loadingOverlay.remove(); if (canvas) canvas.focus(); }, 300); })
                .catch(err => console.error("Failed to start Godot:", err));
        })();
    </script>
</body>
</html>
